# Deferred render-callback queue (0x82B8C764), Most Wanted's queue in Carbon
# (runtime/game/carbon/render_queue.cpp): lock-free producer/consumer across
# threads with no barriers. Release before each publish (the store of the
# write pointer, +20): the push function sub_82469318 and its inlined copies
# in sub_824EDFE0 (three), sub_824EF608 and sub_824EF700;
# acquire in the playback loop sub_82469390 before an entry is read.
# Found by m2/scripts/scan_publish.py (it finds Most Wanted's six exactly).
[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x82469380

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x824EE204

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x824EE26C

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x824EE2FC

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x824EF6DC

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x824EF894

[[midasm_hook]]
name = "RenderQueueAcquire"
address = 0x824693E8

# Game time in whole vblanks (runtime/game/carbon/frame_time.cpp): the
# frame's measured time (milliseconds, 16.16 fixed point) as the main loop
# (sub_82453158) passes it to the frame (sub_82452D78), as Most Wanted's
# 0x823B0148 ...
[[midasm_hook]]
name = "GameFrameTime"
address = 0x824532A4
registers = ["r3"]

# ... the world's step count, just truncated from the accumulated seconds
# (sub_82529BE0, `cmpwi cr6,r11,1`; f0 = the seconds) ...
[[midasm_hook]]
name = "WorldStepCount"
address = 0x82529C60
registers = ["r11", "f0"]

# ... and the return below one step, counted for the [perf] line.
[[midasm_hook]]
name = "WorldNoStep"
address = 0x82529C2C

# Hor+ and Vert+ (runtime/game/carbon/ultrawide.cpp): the projection's x and
# y scales (f5, f11; both of the view setup's matrices are built from them)
# before their first store in sub_822CEA60 (r7 = the view, its id at +8) ...
[[midasm_hook]]
name = "UltrawideProjection"
address = 0x822CED84
registers = ["r7", "f5", "f11"]

# ... and the front-end (HUD) matrix's x and y scales (f13, f0), at the branch
# that ends its widescreen case (sub_8250AC68).
[[midasm_hook]]
name = "UltrawideFrontEnd"
address = 0x8250AD60
registers = ["f13", "f0"]
