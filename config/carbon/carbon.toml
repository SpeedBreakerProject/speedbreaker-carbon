# XenonRecomp config for NFS: Carbon Collector's Edition (Xbox 360, USA;
# title 454107EC, media 1F8BEB88)
# default.xex SHA-256 922c7a1a2fc77405c43aac5159ad67fb0414c872084abc3335c68dbb4bec1815
# Paths are relative to this file. Needs XenonRecomp with patch 0009
# (eqv, dcbst, bdnzt; problems that would drop code are fatal).
#
# Regenerate the generated blocks and switch tables (from the repo root):
#   tools/XenonRecomp/build/XenonAnalyse/XenonAnalyse game-carbon/files/default.xex game-carbon/survey/switch_tables.raw.toml
#   SB_GAME=carbon python3 survey/fix_switch_tables.py
#   (recompile, then) SB_GAME=carbon python3 survey/find_missing_tables.py > config/carbon/switch_tables_inline.toml
#   SB_GAME=carbon python3 survey/fix_switch_tables.py
#   SB_GAME=carbon python3 survey/leaf_switch_bounds.py --write
#   (recompile, then) SB_GAME=carbon python3 survey/find_entry_points.py --write

[main]
file_path = "../../game-carbon/files/default.xex"
out_directory_path = "../../ppc-carbon"
switch_table_file_path = "switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Found by survey/xexsurvey.cpp byte patterns (one hit each): the same XDK
# CRT layout as Most Wanted's (restgpr = savegpr + 0x50, vmx_64 = vmx_14 + 0x94).
restgprlr_14_address = 0x8279BFF0
savegprlr_14_address = 0x8279BFA0
restfpr_14_address = 0x8279C60C
savefpr_14_address = 0x8279C5C0
restvmx_14_address = 0x8279E408
savevmx_14_address = 0x8279E170
restvmx_64_address = 0x8279E49C
savevmx_64_address = 0x8279E204

# longjmp: restores r14-r31 from the jmp_buf and calls RtlUnwind (the same
# code as Most Wanted's at 0x826BCD30).
# setjmp: hook check (lis/lwz/bnectr), then mflr/mfcr and saves into r3 (as
# Most Wanted's at 0x826BF180, with its own hook pointer 0x83005FA4).
longjmp_address = 0x8279B1E0
setjmp_address = 0x8279CE90

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
]

# --- generated by survey/find_entry_points.py --write ---
# Secondary entry points: code addresses the game calls through pointers
# that lie inside another function. Do not edit by hand; rerun.
secondary_entries = [
    0x8279A96C,  # referenced from code; in .pdata fn 0x8279A840
    0x827A38C0,  # referenced from data; in .pdata fn 0x827A3818
    0x827A3B14,  # referenced from data; in .pdata fn 0x827A3A18
    0x827AA07C,  # referenced from data; in .pdata fn 0x827A9FB8
    0x827C1848,  # referenced from code; leaf code
    0x82944E5C,  # referenced from data; in .pdata fn 0x82944D08
]
# --- end find_entry_points ---

